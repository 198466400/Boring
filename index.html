<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADHDIKTED — Professional Diesel Diagnostics | codedkota.com</title>
<meta name="description" content="Enterprise diesel diagnostic platform. Live data. Fault analysis. AI-powered repair intelligence. Built for shops, fleets, and owner-operators.">
<meta property="og:title" content="ADHDIKTED Diagnostics — codedkota.com">
<meta property="og:description" content="The diagnostic platform built by wrenchers, for wrenchers. Live engine data. AI fault analysis. Revenue-generating shop tools.">
<meta property="og:url" content="https://codedkota.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  /* ADHDIKTED BRAND TOKENS */
  --void:#050709;
  --deep:#080c10;
  --plate:#0d1219;
  --steel:#131b24;
  --rim:#1a2535;
  --wire:#243040;

  /* SIGNAL ORANGE — the one bold risk */
  --sig:#ff6b1a;
  --sig2:#ff8c47;
  --sig3:#ffb380;
  --sigd:#1a0800;
  --sigf:rgba(255,107,26,.08);
  --sigf2:rgba(255,107,26,.15);
  --sigborder:rgba(255,107,26,.3);

  /* UTILITY */
  --ok:#22c55e;
  --warn:#eab308;
  --alert:#ef4444;
  --cyan:#22d3ee;
  --purple:#a855f7;

  /* TYPE */
  --t:#dde8f0;
  --t2:#7a9ab8;
  --t3:#3a5570;
  --t4:#1e3048;

  --display:'Bebas Neue',sans-serif;
  --body:'Space Grotesk',sans-serif;
  --mono:'Space Mono',monospace;
}

html,body{
  background:var(--void);
  color:var(--t);
  font-family:var(--body);
  scroll-behavior:smooth;
}

/* ── SCAN LINES ATMOSPHERE ── */
body::after{
  content:'';
  position:fixed;inset:0;
  pointer-events:none;z-index:9999;
  background:repeating-linear-gradient(
    0deg,transparent,transparent 2px,
    rgba(0,0,0,.06) 2px,rgba(0,0,0,.06) 3px
  );
}

/* ── NAV ── */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:1000;
  display:flex;align-items:center;
  padding:0 32px;height:60px;
  background:rgba(5,7,9,.92);
  border-bottom:1px solid var(--wire);
  backdrop-filter:blur(12px);
}
.nav-brand{
  font-family:var(--display);
  font-size:26px;letter-spacing:3px;
  background:linear-gradient(90deg,var(--sig),var(--sig2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.nav-sub{
  font-family:var(--mono);font-size:8px;
  letter-spacing:4px;color:var(--t3);
  margin-left:12px;padding-left:12px;
  border-left:1px solid var(--wire);
}
.nav-links{display:flex;gap:28px;margin-left:auto;align-items:center;}
.nav-link{
  font-family:var(--mono);font-size:10px;letter-spacing:2px;
  color:var(--t3);cursor:pointer;transition:color .2s;
  text-decoration:none;
}
.nav-link:hover{color:var(--sig2);}
.nav-cta{
  padding:8px 20px;
  font-family:var(--mono);font-size:10px;letter-spacing:2px;
  background:var(--sig);color:#fff;border:none;cursor:pointer;
  clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);
  transition:all .2s;
}
.nav-cta:hover{background:var(--sig2);box-shadow:0 0 24px rgba(255,107,26,.4);}

/* ── HERO ── */
.hero{
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:120px 32px 80px;
  position:relative;overflow:hidden;
  text-align:center;
}
.hero-grid{
  position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(255,107,26,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,107,26,.04) 1px,transparent 1px);
  background-size:60px 60px;
}
.hero-glow{
  position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);
  width:700px;height:700px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(255,107,26,.07) 0%,transparent 65%);
  pointer-events:none;
}
.hero-eyebrow{
  font-family:var(--mono);font-size:10px;letter-spacing:6px;
  color:var(--sig);margin-bottom:20px;
  border:1px solid var(--sigborder);
  padding:5px 16px;display:inline-block;
  background:var(--sigf);
}
.hero-title{
  font-family:var(--display);
  font-size:clamp(72px,12vw,160px);
  line-height:.92;letter-spacing:4px;
  background:linear-gradient(135deg,
    var(--t) 0%,
    var(--sig2) 40%,
    var(--sig) 60%,
    var(--t) 100%
  );
  background-size:200% auto;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  animation:titleshine 6s linear infinite;
  margin-bottom:8px;
}
@keyframes titleshine{
  0%{background-position:0% center}
  100%{background-position:200% center}
}
.hero-domain{
  font-family:var(--mono);font-size:13px;letter-spacing:6px;
  color:var(--t3);margin-bottom:32px;
}
.hero-deck{
  font-size:18px;line-height:1.7;color:var(--t2);
  max-width:580px;margin:0 auto 48px;font-weight:300;
}
.hero-deck strong{color:var(--t);font-weight:600;}
.hero-actions{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}
.btn-primary{
  padding:16px 40px;
  font-family:var(--display);font-size:20px;letter-spacing:4px;
  background:linear-gradient(135deg,var(--sigd),#200d00);
  border:1px solid var(--sig);color:var(--sig2);
  cursor:pointer;position:relative;overflow:hidden;
  clip-path:polygon(14px 0%,100% 0%,calc(100% - 14px) 100%,0% 100%);
  transition:all .3s;text-decoration:none;display:inline-block;
}
.btn-primary:hover{
  box-shadow:0 0 50px rgba(255,107,26,.35);
  background:linear-gradient(135deg,#200d00,#2a1000);
  color:var(--sig3);
}
.btn-shine{
  position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.07) 50%,transparent 65%);
  animation:shine 3s infinite;
}
@keyframes shine{0%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.btn-ghost{
  padding:16px 40px;
  font-family:var(--display);font-size:20px;letter-spacing:4px;
  background:transparent;border:1px solid var(--wire);
  color:var(--t2);cursor:pointer;transition:all .2s;
  clip-path:polygon(14px 0%,100% 0%,calc(100% - 14px) 100%,0% 100%);
  text-decoration:none;display:inline-block;
}
.btn-ghost:hover{border-color:var(--t3);color:var(--t);}

/* ── STATS STRIP ── */
.stats{
  background:var(--deep);
  border-top:1px solid var(--wire);
  border-bottom:1px solid var(--wire);
  padding:28px 32px;
  display:flex;justify-content:center;gap:0;flex-wrap:wrap;
}
.stat{
  display:flex;flex-direction:column;align-items:center;
  padding:0 48px;border-right:1px solid var(--wire);
}
.stat:last-child{border-right:none;}
.stat-n{
  font-family:var(--display);font-size:44px;
  color:var(--sig);line-height:1;
}
.stat-l{
  font-family:var(--mono);font-size:8px;letter-spacing:3px;
  color:var(--t3);margin-top:4px;
}

/* ── SECTIONS ── */
.section{padding:100px 32px;max-width:1200px;margin:0 auto;}
.sh{
  font-family:var(--mono);font-size:10px;letter-spacing:6px;
  color:var(--sig);margin-bottom:16px;
}
.section-title{
  font-family:var(--display);font-size:clamp(42px,6vw,80px);
  line-height:.95;color:var(--t);margin-bottom:24px;
}
.section-title span{color:var(--sig);}

/* ── FEATURE GRID ── */
.feat-grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:1px;background:var(--wire);margin-top:60px;
}
.feat{
  background:var(--deep);padding:36px 32px;
  position:relative;overflow:hidden;
  transition:background .3s;
}
.feat:hover{background:var(--plate);}
.feat::before{
  content:'';position:absolute;top:0;left:0;right:0;
  height:2px;background:transparent;transition:background .3s;
}
.feat:hover::before{background:linear-gradient(90deg,transparent,var(--sig),transparent);}
.feat-icon{
  font-size:28px;margin-bottom:16px;display:block;
}
.feat-title{
  font-family:var(--display);font-size:22px;letter-spacing:2px;
  color:var(--t);margin-bottom:8px;
}
.feat-desc{font-size:14px;color:var(--t2);line-height:1.7;}
.feat-tag{
  margin-top:16px;
  font-family:var(--mono);font-size:8px;letter-spacing:2px;
  padding:3px 8px;display:inline-block;
  border:1px solid var(--sigborder);color:var(--sig2);
  background:var(--sigf);
}

/* ── REVENUE SECTION ── */
.revenue{
  background:var(--deep);
  border-top:1px solid var(--wire);
  border-bottom:1px solid var(--wire);
  padding:100px 32px;
}
.rev-inner{max-width:1200px;margin:0 auto;}
.rev-grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:24px;margin-top:60px;
}
.rev-card{
  border:1px solid var(--wire);
  background:var(--plate);
  padding:32px 28px;
  position:relative;overflow:hidden;
}
.rev-card::after{
  content:'';
  position:absolute;bottom:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--sig),transparent);
}
.rev-num{
  font-family:var(--display);font-size:80px;
  color:var(--sigf2);line-height:1;
  position:absolute;top:16px;right:20px;
  border:none;
  -webkit-text-stroke:1px var(--sigborder);
  -webkit-text-fill-color:transparent;
}
.rev-label{
  font-family:var(--mono);font-size:8px;letter-spacing:4px;
  color:var(--sig);margin-bottom:12px;
}
.rev-title{
  font-family:var(--display);font-size:28px;
  color:var(--t);margin-bottom:10px;
}
.rev-desc{font-size:14px;color:var(--t2);line-height:1.7;}
.rev-est{
  margin-top:20px;padding:10px 14px;
  background:var(--sigf);border:1px solid var(--sigborder);
  font-family:var(--mono);font-size:10px;color:var(--sig2);
  letter-spacing:1px;
}

/* ── PRICING ── */
.pricing-grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:24px;margin-top:60px;
}
.price-card{
  border:1px solid var(--wire);
  background:var(--plate);
  padding:36px 28px;
}
.price-card.featured{
  border-color:var(--sig);
  background:linear-gradient(180deg,var(--sigf),var(--plate));
  position:relative;
}
.price-card.featured::before{
  content:'MOST POPULAR';
  position:absolute;top:-1px;left:50%;transform:translateX(-50%);
  font-family:var(--mono);font-size:8px;letter-spacing:3px;
  background:var(--sig);color:#fff;padding:4px 16px;
}
.price-tier{
  font-family:var(--mono);font-size:9px;letter-spacing:4px;
  color:var(--t3);margin-bottom:12px;
}
.price-name{
  font-family:var(--display);font-size:32px;
  color:var(--t);margin-bottom:20px;
}
.price-amount{
  font-family:var(--display);font-size:56px;
  color:var(--sig);line-height:1;
}
.price-period{
  font-family:var(--mono);font-size:10px;color:var(--t3);
  margin-bottom:28px;
}
.price-features{list-style:none;margin-bottom:28px;}
.price-features li{
  font-size:13px;color:var(--t2);
  padding:8px 0;border-bottom:1px solid var(--wire);
  display:flex;gap:10px;
}
.price-features li::before{content:'→';color:var(--sig);font-family:var(--mono);}
.price-btn{
  width:100%;padding:13px;
  font-family:var(--display);font-size:16px;letter-spacing:3px;
  background:transparent;border:1px solid var(--sig);
  color:var(--sig2);cursor:pointer;transition:all .2s;
  clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);
}
.price-btn:hover,.price-card.featured .price-btn{
  background:var(--sig);color:#fff;
}

/* ── LEAD FORM ── */
.lead-section{
  background:var(--deep);
  border-top:1px solid var(--wire);
  padding:100px 32px;text-align:center;
}
.lead-inner{max-width:600px;margin:0 auto;}
.lead-form{
  display:flex;flex-direction:column;gap:14px;
  margin-top:40px;text-align:left;
}
.lead-input{
  background:var(--plate);
  border:1px solid var(--wire);
  color:var(--t);
  font-family:var(--mono);font-size:12px;
  padding:14px 18px;outline:none;
  transition:border-color .2s;
  clip-path:polygon(6px 0%,100% 0%,calc(100% - 6px) 100%,0% 100%);
}
.lead-input:focus{border-color:var(--sig);}
.lead-input::placeholder{color:var(--t3);}
.lead-select{
  background:var(--plate);
  border:1px solid var(--wire);
  color:var(--t);
  font-family:var(--mono);font-size:12px;
  padding:14px 18px;outline:none;
  cursor:pointer;
}
.lead-btn{
  padding:16px;
  font-family:var(--display);font-size:20px;letter-spacing:4px;
  background:var(--sig);color:#fff;
  border:none;cursor:pointer;
  clip-path:polygon(10px 0%,100% 0%,calc(100% - 10px) 100%,0% 100%);
  transition:all .2s;
}
.lead-btn:hover{background:var(--sig2);box-shadow:0 0 40px rgba(255,107,26,.4);}

/* ── FOOTER ── */
.footer{
  background:var(--void);
  border-top:1px solid var(--wire);
  padding:48px 32px;
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:20px;
}
.footer-brand{
  font-family:var(--display);font-size:22px;letter-spacing:3px;
  background:linear-gradient(90deg,var(--sig),var(--sig2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.footer-copy{
  font-family:var(--mono);font-size:9px;letter-spacing:2px;
  color:var(--t3);
}
.footer-links{display:flex;gap:24px;}
.footer-link{
  font-family:var(--mono);font-size:9px;letter-spacing:1px;
  color:var(--t3);cursor:pointer;transition:color .2s;
  text-decoration:none;
}
.footer-link:hover{color:var(--sig2);}

/* ══════════════════════════════════
   THE APP — /app route
══════════════════════════════════ */
.app-shell{
  display:flex;flex-direction:column;
  height:100vh;overflow:hidden;
}
.app-topbar{
  display:flex;align-items:stretch;
  background:var(--deep);
  border-bottom:2px solid rgba(255,107,26,.3);
  flex-shrink:0;min-height:54px;
  position:relative;
}
.app-topbar::after{
  content:'';position:absolute;bottom:-4px;left:0;right:0;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--sig),var(--sig2),var(--sig),transparent);
}
.app-brand{
  display:flex;align-items:center;gap:10px;
  padding:0 20px;border-right:1px solid var(--rim);
  background:linear-gradient(90deg,var(--sigf),transparent);
  min-width:180px;
}
.app-bname{
  font-family:var(--display);font-size:20px;letter-spacing:3px;
  background:linear-gradient(90deg,var(--sig2),var(--sig3));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.app-bsub{
  font-family:var(--mono);font-size:7px;letter-spacing:3px;color:var(--t3);
}
.app-rigs{
  display:flex;align-items:center;gap:6px;padding:0 14px;
  border-right:1px solid var(--rim);
}
.rig-pill{
  display:flex;align-items:center;gap:5px;
  padding:5px 12px;border:1px solid var(--rim);
  background:transparent;color:var(--t2);cursor:pointer;
  font-family:var(--mono);font-size:9px;letter-spacing:1px;
  transition:all .15s;
  clip-path:polygon(4px 0%,100% 0%,calc(100% - 4px) 100%,0% 100%);
}
.rig-pill:hover{border-color:var(--sig);color:var(--sig2);}
.rig-pill.on{background:var(--sigf);border-color:var(--sig);color:var(--sig2);}
.rig-dot{width:6px;height:6px;border-radius:50%;}
.app-right{
  display:flex;align-items:center;margin-left:auto;
}
.app-seg{
  display:flex;align-items:center;gap:6px;
  padding:0 14px;border-left:1px solid var(--rim);
  font-family:var(--mono);font-size:9px;color:var(--t3);height:100%;
}
.live-dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--ok);box-shadow:0 0 6px var(--ok);
  animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.app-tabs{
  display:flex;background:var(--plate);
  border-bottom:1px solid var(--rim);
  flex-shrink:0;overflow-x:auto;scrollbar-width:none;
}
.app-tabs::-webkit-scrollbar{display:none;}
.app-tab{
  padding:10px 16px;
  font-family:var(--display);font-size:9px;
  font-weight:700;letter-spacing:2px;
  color:var(--t3);cursor:pointer;
  border-bottom:2px solid transparent;
  transition:all .2s;white-space:nowrap;
}
.app-tab:hover{color:var(--t2);}
.app-tab.on{color:var(--sig2);border-bottom-color:var(--sig);}
.app-main{
  flex:1;overflow-y:auto;
  padding:18px 20px 50px;
  background:var(--void);
}
.app-main::-webkit-scrollbar{width:3px;}
.app-main::-webkit-scrollbar-thumb{background:rgba(255,107,26,.3);}

/* ── AD AGENT COMPONENTS ── */
.ad-strip{
  display:flex;align-items:center;gap:14px;
  background:var(--plate);
  border:1px solid var(--wire);
  border-left:3px solid var(--sig);
  padding:10px 16px;margin-bottom:14px;
  position:relative;overflow:hidden;
}
.ad-strip::before{
  content:'SPONSORED';
  position:absolute;top:4px;right:8px;
  font-family:var(--mono);font-size:7px;letter-spacing:2px;
  color:var(--t3);
}
.ad-logo{
  width:32px;height:32px;border-radius:4px;
  background:var(--steel);display:flex;align-items:center;
  justify-content:center;font-family:var(--mono);font-size:8px;
  color:var(--sig2);flex-shrink:0;border:1px solid var(--sigborder);
}
.ad-body{flex:1;}
.ad-name{
  font-family:var(--mono);font-size:10px;color:var(--t);
  letter-spacing:1px;margin-bottom:2px;
}
.ad-sub{font-size:11px;color:var(--t2);}
.ad-cta{
  padding:6px 14px;
  font-family:var(--mono);font-size:9px;letter-spacing:1px;
  background:var(--sig);color:#fff;border:none;cursor:pointer;
  clip-path:polygon(4px 0%,100% 0%,calc(100% - 4px) 100%,0% 100%);
  white-space:nowrap;transition:all .15s;flex-shrink:0;
}
.ad-cta:hover{background:var(--sig2);}

.part-ad{
  border:1px solid var(--sigborder);
  background:linear-gradient(135deg,var(--sigf),var(--plate));
  padding:12px 16px;margin-top:8px;
  display:flex;align-items:center;gap:12px;
  position:relative;
}
.part-ad::before{
  content:'PARTS MATCH';
  position:absolute;top:-1px;left:0;
  font-family:var(--mono);font-size:7px;letter-spacing:2px;
  background:var(--sig);color:#fff;padding:2px 8px;
}
.part-ad-info{flex:1;margin-top:8px;}
.part-ad-name{
  font-family:var(--mono);font-size:10px;color:var(--sig2);
  margin-bottom:3px;
}
.part-ad-price{
  font-family:var(--display);font-size:20px;color:var(--ok);
}
.part-ad-src{
  font-family:var(--mono);font-size:8px;color:var(--t3);
}
.part-ad-btn{
  padding:8px 16px;
  font-family:var(--mono);font-size:9px;
  background:transparent;border:1px solid var(--ok);
  color:var(--ok);cursor:pointer;transition:all .15s;
  clip-path:polygon(4px 0%,100% 0%,calc(100% - 4px) 100%,0% 100%);
}
.part-ad-btn:hover{background:var(--Gf);border-color:var(--ok);}

/* ── APP CONTENT BLOCKS ── */
.blk-sh{
  display:flex;align-items:center;gap:10px;
  margin-bottom:14px;font-family:var(--mono);
  font-size:9px;font-weight:700;letter-spacing:5px;
  color:var(--sig);text-transform:uppercase;
}
.blk-sh::after{
  content:'';flex:1;height:1px;
  background:linear-gradient(90deg,rgba(255,107,26,.3),transparent);
}
.row-flex{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:14px;flex-wrap:wrap;gap:8px;

/* ══════════════════════════════════════
   HOLOGRAPHIC CORNER SYSTEM
   Layered prismatic HUD frames
══════════════════════════════════════ */

/* Corner bracket base */
.holo-frame {
  position: relative;
}
.holo-frame::before,
.holo-frame::after {
  content: '';
  position: absolute;
  width: 48px;
  height: 48px;
  pointer-events: none;
  z-index: 10;
}
/* Top-left */
.holo-frame::before {
  top: -1px; left: -1px;
  border-top: 2px solid var(--sig);
  border-left: 2px solid var(--sig);
  filter: drop-shadow(0 0 6px var(--sig)) drop-shadow(0 0 14px rgba(255,107,26,.4));
}
/* Bottom-right */
.holo-frame::after {
  bottom: -1px; right: -1px;
  border-bottom: 2px solid var(--sig);
  border-right: 2px solid var(--sig);
  filter: drop-shadow(0 0 6px var(--sig)) drop-shadow(0 0 14px rgba(255,107,26,.4));
}

/* Inner holographic SVG corners — injected via React */
.holo-corner {
  position: absolute;
  pointer-events: none;
  z-index: 11;
}
.holo-corner.tl { top: -2px; left: -2px; }
.holo-corner.tr { top: -2px; right: -2px; transform: scaleX(-1); }
.holo-corner.bl { bottom: -2px; left: -2px; transform: scaleY(-1); }
.holo-corner.br { bottom: -2px; right: -2px; transform: scale(-1,-1); }

/* Prismatic shimmer animation */
@keyframes holo-shift {
  0%   { filter: hue-rotate(0deg)   drop-shadow(0 0 4px var(--sig)) drop-shadow(0 0 12px rgba(255,107,26,.5)); }
  25%  { filter: hue-rotate(30deg)  drop-shadow(0 0 8px #ff9f1a)    drop-shadow(0 0 20px rgba(255,159,26,.4)); }
  50%  { filter: hue-rotate(-20deg) drop-shadow(0 0 6px #ff5c1a)    drop-shadow(0 0 16px rgba(255,92,26,.5)); }
  75%  { filter: hue-rotate(15deg)  drop-shadow(0 0 8px #ffcc1a)    drop-shadow(0 0 20px rgba(255,204,26,.4)); }
  100% { filter: hue-rotate(0deg)   drop-shadow(0 0 4px var(--sig)) drop-shadow(0 0 12px rgba(255,107,26,.5)); }
}
@keyframes holo-scan {
  0%   { opacity: 0.15; transform: translateY(-100%); }
  100% { opacity: 0;    transform: translateY(100%); }
}
@keyframes corner-pulse {
  0%,100% { opacity: 1; }
  50%      { opacity: 0.6; }
}

.holo-svg {
  animation: corner-pulse 3s ease-in-out infinite;
}
.holo-svg .pri { animation: holo-shift 4s ease-in-out infinite; }
.holo-svg .sec { animation: holo-shift 4s ease-in-out infinite 1s; }
.holo-svg .ter { animation: holo-shift 4s ease-in-out infinite 2s; }

/* Scan line overlay for holographic panels */
.holo-scan-wrap {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 2;
}
.holo-scan-line {
  position: absolute;
  left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(255,107,26,.08) 20%,
    rgba(255,180,80,.18) 50%,
    rgba(255,107,26,.08) 80%,
    transparent 100%
  );
  animation: holo-scan 6s linear infinite;
}

/* Hero holographic frame — full viewport box */
.hero-holo-tl,
.hero-holo-tr,
.hero-holo-bl,
.hero-holo-br {
  position: absolute;
  width: 120px;
  height: 120px;
  pointer-events: none;
  z-index: 5;
}

function log(m){st.log.push(m);if(st.log.length>60)st.log.shift();}

async function openBLE(){
  var dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:SVC});
  var srv=await dev.gatt.connect(),svcs=await srv.getPrimaryServices(),rx=null,tx=null;

  await rx.startNotifications();
  rx.addEventListener('characteristicvaluechanged',function(e){cb(dec.decode(e.target.value))});
  dev.addEventListener('gattserverdisconnected',function(){if(st.status==='connected')drop('Adapter disconnected.')});

    write:function(t){var b=enc.encode(t);return (tx.properties.writeWithoutResponse&&!tx.properties.write)?tx.writeValueWithoutResponse(b):tx.writeValue(b)},

}
async function openSerial(port,baud){
  await port.open({baudRate:baud});
  var w=port.writable.getWriter(),r=port.readable.getReader(),cb=function(){},alive=true;
  (async function(){try{while(alive){var x=await r.read();if(x.done)break;cb(dec.decode(x.value))}}catch(e){}})();

    close:async function(){alive=false;try{await r.cancel()}catch(e){}try{w.releaseLock();r.releaseLock();await port.close()}catch(e){}}};
}
async function serialT(){

}

/* ELM327 layer */
function wire(t){T=t;buf='';t.onData(function(s){buf+=s;if(buf.indexOf('>')>=0&&waiter){var w=waiter,r=buf;waiter=null;buf='';w(r)}})}
function cmd(c,to){
  var p=busy.then(function(){return new Promise(function(res,rej){
    if(!T)return rej(new Error('Not connected'));
    buf='';
    var tm=setTimeout(function(){waiter=null;rej(new Error('Timeout: '+c))},to||6000);
    waiter=function(r){clearTimeout(tm);var L=r.replace(/>/g,'').split(/[\r\n]+/).map(function(x){return x.trim()}).filter(function(x){return x&&x!==c});log(c+' > '+L.join(' | '));res(L)};
    Promise.resolve(T.write(c+'\r')).catch(function(e){clearTimeout(tm);waiter=null;rej(e)});
  })});

}
function hexLines(L){return L.map(function(l){return l.replace(/^\d+:\s*/,'')}).filter(function(l){return /^([0-9A-F]{2}\s?)+$/i.test(l)&&!/^[0-9A-F]{3}$/i.test(l)})}

async function q01(p){
  var hl=hexLines(await cmd('01'+p));
  for(var i=0;i<hl.length;i++){var b=bytesOf(hl[i]);if(b[0]===0x41&&b[1]===parseInt(p,16))return b.slice(2)}
  return null;
}
async function scan(){
  var out=[],base=0,more=true;
  while(more&&base<=0x60){
    var b=await q01(base.toString(16).toUpperCase().padStart(2,'0'));
    if(!b||b.length<4)break;
    var m=((b[0]<<24)|(b[1]<<16)|(b[2]<<8)|b[3])>>>0;
    for(var i=0;i<32;i++)if(m&(1<<(31-i)))out.push(base+i+1);
    more=!!(m&1);base+=0x20;
  }
  return out;
}
async function refreshMIL(){var b=await q01('01');if(b)set({mil:!!(b[0]&0x80),nd:b[0]&0x7F})}
async function init(t){
  wire(t);set({msg:'Initializing adapter…'});
  var ver=(await cmd('ATZ',4000)).join(' ');
  await cmd('ATE0');await cmd('ATL0');await cmd('ATH0');await cmd('ATSP0');
  var r=(await cmd('0100',15000)).join(' ');
  if(!/41 00/.test(r))throw new Error('Adapter connected, but the vehicle did not answer. Turn ignition ON (engine off is fine) and retry.');
  var dp=(await cmd('ATDPN')).join('').replace(/^A/,'');protoNum=parseInt(dp,16)||0;

async function poll(){
  var want=P.filter(function(x){return SUP.indexOf(parseInt(x[0],16))>=0}),errs=0;

}

async function codes(mode){

}

    var j=((await (await fetch('https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/'+vin+'?format=json')).json()).Results||[{}])[0]||{};
